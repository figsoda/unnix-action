name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  ci:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner:
          - macos-latest
          - ubuntu-24.04-arm
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up unnix
        uses: ./

      - run: actionlint

      - run: shellcheck setup.sh

      - run: shfmt -d setup.sh

      - run: typos

      - run: zizmor .
